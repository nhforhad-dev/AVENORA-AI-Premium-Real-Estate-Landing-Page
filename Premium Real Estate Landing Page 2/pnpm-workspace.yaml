packages:
  - '.'
supportedArchitectures:
  os:
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
# Refuse packages published < 7 days ago, matching the root pnpm-workspace.yaml.
minimumReleaseAge: 10080
# Allow trusted build-tool install scripts so CI (e.g. Vercel) logs stay clean.
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
